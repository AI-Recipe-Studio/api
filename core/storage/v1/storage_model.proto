syntax = "proto3";

package core.storage.v1;

// 참고용 파일 타입
// 실제 사용하는 MIME 참조 필요
enum FileType {
  FILE_TYPE_UNSPECIFIED = 0;
  FILE_TYPE_VIDEO = 1;
  // 세로 영상
  FILE_TYPE_VERTICAL_VIDEO = 2;
  FILE_TYPE_IMAGE = 3;
  FILE_TYPE_AUDIO = 4;
  FILE_TYPE_BOOK = 5;
  FILE_TYPE_ETC = 10;
}

// 파일 정보
message File {
  string id = 1;
  // 접근한 유저에게 생성된 object 접근 url
  string url = 2;
  // 서비스상 파일 구분
  FileType type = 3;
  // 파일의 크기
  uint64 file_size = 4;
  // 실제 업로드 된 파일의 mime
  string mime = 5;
}
