syntax = "proto3";

package core.common.v1;

// UserContentStatusType는 사용자에 의해 발행된 게시물(Post, Comment, Collection 등)에 대한 상태 이다.
enum UserContentStatusType {
  // 선택 안됨 -> 명시적 오류 발생 필요
  USER_CONTENT_STATUS_TYPE_UNSPECIFIED = 0;

  // --------------------------------------------------------
  // [1~10] 게시자(User) 주도의 상태 라이프사이클
  // --------------------------------------------------------

  // 유저가 업로드 중이거나 메타데이터를 임시 저장한 상태 (외부 미노출)
  USER_CONTENT_STATUS_TYPE_DRAFT = 1;
  // 정상적으로 서비스에 노출되는 최초 게시 상태
  USER_CONTENT_STATUS_TYPE_PUBLIC = 2;
  // 지정된 미래의 특정 시간에 자동으로 PUBLIC으로 전환될 예약 게시 상태 (공개 예고)
  USER_CONTENT_STATUS_TYPE_SCHEDULED = 3;
  // 게시자가 명시적으로 공개를 홀드/보류해 둔 상태
  USER_CONTENT_STATUS_TYPE_PENDING_BY_USER = 4;
  // 게시자가 나만 보려고 비공개 처리한 상태
  USER_CONTENT_STATUS_TYPE_PRIVATE = 5;
  // 게시자가 삭제 처리함
  USER_CONTENT_STATUS_TYPE_DELETED = 6;

  // --------------------------------------------------------
  // [10~19] 플랫폼(Platform/Admin) 제어 및 제재 상태
  // --------------------------------------------------------

  // 저작권 필터링 시스템, 성인물 검수 등으로 인해 플랫폼이 잠시 보류한 상태
  USER_CONTENT_STATUS_TYPE_PENDING_BY_PLATFORM = 10;
  // 유저 신고 누적 등으로 인해 관리자 검수 전까지 임시 블라인드 처리된 상태
  USER_CONTENT_STATUS_TYPE_HIDDEN = 11;
  // 서비스 약관 및 저작권 위반이 확정되어 관리자가 영구 정지/차단한 상태
  USER_CONTENT_STATUS_TYPE_BANNED = 12;
}

// MediaProcessingStatusType는 미디어(영상, 이미지, 텍스트) 등을 처리하는 상태이다.
//
// AI를 통한 영상, 이미지, 텍스트 생성 상태과 FFmpeg 트랜스코딩, Shaka 패키징, 결과물 업로드 등의 파이프라인 작업의 진행상황을 type으로 나타낸다.
enum MediaProcessingStatusType {
  MEDIA_PROCESSING_STATUS_TYPE_UNSPECIFIED = 0;
  // 플랫폼 파이프라인 대기중 상태
  MEDIA_PROCESSING_STATUS_TYPE_PENDING = 1;
  // 플랫폼 파이프라인(AI 콘텐츠(영상, 이미지, 텍스트) 생성, FFmpeg 트랜스코딩, Shaka 패키징, 결과물 업로드 등)에서 처리가 진행중인 상태
  MEDIA_PROCESSING_STATUS_TYPE_PROCESSING = 2;
  // 파이프라인 작업중 오류가 발생한 상태 ( 1회 재시도 이후 실패 상태로 변경)
  MEDIA_PROCESSING_STATUS_TYPE_ERROR = 3;
  // 파이프라인 작업 실패
  MEDIA_PROCESSING_STATUS_TYPE_FAILED = 4;
  // 성공적으로 완료되어 준비가 완료됨
  MEDIA_PROCESSING_STATUS_TYPE_COMPLETED = 5;
}
