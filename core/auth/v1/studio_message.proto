syntax = "proto3";

package core.auth.v1;

import "google/protobuf/timestamp.proto";

message Studio {
  string id = 1;
  string name = 2;
  string description = 3;

  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp updated_at = 11;
  google.protobuf.Timestamp deleted_at = 12;
}

enum PlanType {
  // 명시적 에러 발생
  PLAN_TYPE_UNSPECIFIED = 0;
  PLAN_TYPE_FREE = 1;

  PLAN_TYPE_DEMO = 2;
  // 추후 학생 할인 등
  PLAN_TYPE_STUDENT = 3;

  PLAN_TYPE_BASIC = 5;

  PLAN_TYPE_CREATOR = 6;

  PLAN_TYPE_PRO = 9;

  PLAN_TYPE_ENTERPRISE = 15;
}

message PlanTypeInfo {
  string name = 1;
  PlanType type = 2;

  // metadata

  // 최대 포함 인원
  //
  // 각 플랜별로 역할 설정 범위가 다르다.
  // 예를 들어 BASIC의 경우 수정, 삭제 권한이 있는 worker 역할군만 할당할 수 있다.
  // CREATOR의 경우 수정 삭제 권한이 있는 manager 1명과 수정 권한만 존재하는 worker 역할군을 할당할 수 있다.
  // PRO 플랜의 경우 파일별 접근 권한이 다른 manager 3명 및 수정 권한이 있는 worker 역할군을 할당할 수 있다.
  // ENTERPRISE 플랜의 경우 역할군을 직접 커스텀 할 수 있다.
  uint32 max_crew_amount = 10;
  // 구독시 제공되는 크레딧 정보
  // 1$ = 1e6(1,000,000) 크레딧으로 환산
  uint64 built_in_credit = 11;
}

// PaymentStatusType는 결제 상태를 관리하기 위한 enum 이다.
enum PaymentStatusType {
  PAYMENT_STATUS_TYPE_UNSPECIFIED = 0;
  // 결제 처리중
  PAYMENT_STATUS_TYPE_PENDING = 1;
  // 결제 성공
  PAYMENT_STATUS_TYPE_SUCCEEDED = 2;
  // 결제 실패
  PAYMENT_STATUS_TYPE_FAILED = 3;
  // 환불
  PAYMENT_STATUS_TYPE_REFUNDED = 4;
  // 결제 취소
  PAYMENT_STATUS_TYPE_CANCELED = 5;
}

message PlanInfo {
  string studio_id = 1;
  PlanTypeInfo type = 2;

  CreditInfo credit = 3;

  // 구독 갱신 성공 유무
  PaymentStatusType last_payment_status = 10;
  // 플랜 시작일
  google.protobuf.Timestamp payment_start_date = 11;
  // 결제 예정일
  google.protobuf.Timestamp payment_due_date = 12;
}

// CreditInfo는 현 플랜의 결제일 기준 정보이다.
//
// 조회시에는 별도로 제공한다.
// credit의 경우 1$ = 1e6(1,000,000) 크레딧으로 환산된다.
// 사용자에게 표시할 때는 $로 변환해서 표시한다.
message CreditInfo {
  // 제공되는 크레딧 정보
  //
  // 구독 혹은 무료 플랜으로 제공되는 크레딧
  // 월별로 갱신 된다(이전 크레딧은 유지 되지 않는다.)
  // 1$ = 1e6(1,000,000) 크레딧으로 환산
  uint64 subscribed_credit = 1;
  // 별도 충전한 크레딧 정보
  // 1$ = 1e6(1,000,000) 크레딧으로 환산
  uint64 charged_credit = 2;
  // 직전 결제일 이후 현시점까지 사용한 크레딧 소모량
  // 1$ = 1e6(1,000,000) 크레딧으로 환산
  uint64 used_credit = 3;
  // 남은 크레딧 정보
  //
  // 구독 플렌의 크레딧이 우선 차감 된다.
  // subscribed_credit + charged_credit - used_credit
  uint64 current_credit = 4;
}

// CreditOperationType는 거래 유형을 관리하기 위한 enum이다.
enum CreditOperationType {
  CREDIT_OPERATION_TYPE_UNSPECIFIED = 0;
  // 사용/소비
  CREDIT_OPERATION_TYPE_SPEND = 1;
  // 충전
  CREDIT_OPERATION_TYPE_CHARGE = 2;
  // 구독 갱신 크레딧
  CREDIT_OPERATION_TYPE_SUBSCRIBE = 3;
  // 환불
  CREDIT_OPERATION_TYPE_REFUND = 4;
  // 관리자 조정
  CREDIT_OPERATION_TYPE_ADJUSTMENT = 5;
}

message CreditHistoryInfo {
  string id = 1;
  string studio_id = 2;
  string triggered_user_id = 3;
  // 추후 워크플로우 플렛폼 추가시 작업 캔버스 아이디
  string canvas_id = 4;
  // 해당 캔버스의 특정 노드가 트리거 했을 경우 추가는 정보
  string node_id = 5;
  // 입력 토큰량
  uint32 input_token = 6;
  // 출력 토큰량
  uint32 output_token = 7;
  // agent 사용 정보 - id
  string agent_id = 8;
  // agent 사용 정보 - 이름
  string agent_name = 9;

  // 사용된 크레딧
  // 1$ = 1e6(1,000,000) 크레딧으로 환산
  uint64 spent_credit = 10;
  // 거래 유형
  CreditOperationType operation_type = 11;
  // 발생 시간
  google.protobuf.Timestamp created_at = 12;
}
