syntax = "proto3";

package core.studio.v1;

import "core/auth/v1/auth_model.proto";
import "core/rbac/v1/rbac_model.proto";
import "google/protobuf/timestamp.proto";

// Studio 각 서비스에서 사용하는 studio의 기본 정보이다.
//
// 하위 서비스별로 metadata를 추가하여 사용한다.
// 예를들어 core의 Studio에서는 uid가 존재하지 않지만 port의 studio 에서는 uid 필드가 존재한다.
message Studio {
  string studio_id = 1;
  // 스튜디오 명칭
  string name = 2;
  string description = 3;
  // 스튜디오의 리전
  // 추후 리전별 데이터 필터링이 필요한 경우를 위해 수집한다.
  string region = 4;

  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp updated_at = 11;
  google.protobuf.Timestamp deleted_at = 12;
}

message CrewInfo {
  // 대상 스튜디오 id
  string studio_id = 1;
  // 초대된 유저 정보
  core.auth.v1.AccountInfo account_info = 2;
  // 부여된 권한 정보
  repeated core.rbac.v1.Role role = 3;

  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp updated_at = 11;
  google.protobuf.Timestamp deleted_at = 12;

  // TODO: 추후 할당량 제한을 추가할 수 도 있다.
}
